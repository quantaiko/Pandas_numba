[pytest]
# The suite is tests/pandas_numba_tests.py, which matches neither of pytest's
# default patterns (test_*.py / *_test.py), so it is listed explicitly here --
# this lets a bare `D:\Anaconda\python.exe -m pytest` in this folder discover and
# run it (the file's own __main__ block still runs it by explicit path too). Each
# test/example file puts code/ on sys.path itself, so the module imports whether
# run under pytest or directly.
python_files = pandas_numba_tests.py test_*.py *_test.py
testpaths = tests
